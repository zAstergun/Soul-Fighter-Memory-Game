<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd23f"/>
      <stop offset="45%" stop-color="#ff3d9a"/>
      <stop offset="100%" stop-color="#7b2cff"/>
    </linearGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#ff3d9a" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Comic Shadow -->
  <path d="M11 6 L23 6 L19 9 L18 14 L18 18 L19 23 L23 26 L11 26 L15 23 L14 18 L14 14 L15 9 Z" 
        fill="#120725" transform="translate(1.5, 1.5)"/>

  <!-- Main Soul Fighter Stylized I-Beam Body -->
  <path d="M10 5 L22 5 L18 8 L17.5 13 L17.5 19 L18 24 L22 27 L10 27 L14 24 L14.5 19 L14.5 13 L14 8 Z" 
        fill="url(#textGrad)" 
        stroke="#120725" 
        stroke-width="2" 
        stroke-linejoin="round"/>

  <!-- Left Accent Blade Cut -->
  <path d="M10 5 L14 8 L14.5 16 L10 5 Z" fill="#ffd23f" opacity="0.9"/>
  <!-- Right Accent Blade Cut -->
  <path d="M22 27 L18 24 L17.5 16 L22 27 Z" fill="#7b2cff" opacity="0.9"/>

  <!-- Cyan Energy Core Beam -->
  <line x1="16" y1="7" x2="16" y2="25" stroke="#3ee0ff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="11" x2="16" y2="21" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>

  <!-- Central Targeting Soul Core Dot (Hotspot at 16, 16) -->
  <circle cx="16" cy="16" r="2.2" fill="#3ee0ff"/>
  <circle cx="16" cy="16" r="1.1" fill="#ffffff"/>

  <!-- Horizontal Typing Alignment Notches -->
  <line x1="7" y1="16" x2="11" y2="16" stroke="#ffd23f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="16" x2="25" y2="16" stroke="#ffd23f" stroke-width="1.5" stroke-linecap="round"/>
</svg>
